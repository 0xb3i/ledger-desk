<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">LedgerDesk 轻记 — macOS 本地优先个人账本</title>
  <desc id="desc">Hero banner for LedgerDesk showing local-first architecture: read-only QQ Mail IMAP and macOS Keychain feeding a local SQLite ledger service and browser dashboard.</desc>

  <defs>
    <mask id="ledger-mark">
      <rect width="64" height="64" fill="#ffffff"/>
      <rect x="14" y="16" width="22" height="6" rx="3" fill="#000000"/>
      <rect x="14" y="28" width="14" height="6" rx="3" fill="#000000"/>
      <circle cx="48" cy="50" r="14" fill="#000000"/>
    </mask>
  </defs>

  <rect width="1200" height="320" rx="24" fill="#F5F5F7"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#E2E2E6"/>

  <!-- Left Title Block -->
  <g transform="translate(56 46)">
    <!-- App Mark -->
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#FFFFFF" stroke="#E2E2E6"/>
      <g transform="translate(10 6) scale(0.75)">
        <rect x="4" y="4" width="38" height="50" rx="9" fill="#262626" mask="url(#ledger-mark)"/>
        <circle cx="48" cy="50" r="9.5" fill="#E56332"/>
      </g>
    </g>

    <g transform="translate(72 8)">
      <text x="0" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#71717A" letter-spacing="0.6">macOS · LOCAL-FIRST LEDGER</text>
      <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#E56332">轻记 · 仅监听本机地址</text>
    </g>

    <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="52" font-weight="800" fill="#18181B" letter-spacing="-1">LedgerDesk</text>
    <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="500" fill="#3F3F46">从 QQ 邮箱只读同步招商银行交易提醒，账单保存在</text>
    <text x="0" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="500" fill="#3F3F46">本地 SQLite，提供月度总览、预算、核对、订阅与心愿单。</text>

    <g transform="translate(0 218)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#FFFFFF" stroke="#D4D4D8"/>
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#262626">整数分存储</text>

      <rect x="144" y="0" width="144" height="34" rx="8" fill="#FFFFFF" stroke="#D4D4D8"/>
      <text x="160" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#262626">钥匙串存授权码</text>

      <rect x="302" y="0" width="144" height="34" rx="8" fill="#262626"/>
      <text x="318" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Node.js 24 / 26+</text>
    </g>
  </g>

  <!-- Right Local Architecture Card -->
  <g transform="translate(684 36)">
    <rect x="0" y="0" width="460" height="248" rx="18" fill="#FFFFFF" stroke="#E2E2E6"/>
    <text x="24" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#71717A">LOCAL DATA FLOW · 零云端依赖</text>

    <!-- Inputs -->
    <g transform="translate(24 52)">
      <rect x="0" y="0" width="196" height="58" rx="10" fill="#FAFAFA" stroke="#E4E4E7"/>
      <text x="14" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#18181B">QQ 邮箱</text>
      <text x="14" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#71717A">IMAP EXAMINE 只读</text>

      <rect x="216" y="0" width="196" height="58" rx="10" fill="#FAFAFA" stroke="#E4E4E7"/>
      <text x="230" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#18181B">macOS 钥匙串</text>
      <text x="230" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" fill="#71717A">安全保管邮箱授权码</text>
    </g>

    <!-- Arrows down -->
    <path d="M122 114 L122 132 M338 114 L338 132" stroke="#D4D4D8" stroke-width="2" stroke-linecap="round"/>

    <!-- Local Service -->
    <g transform="translate(24 134)">
      <rect x="0" y="0" width="412" height="44" rx="10" fill="#262626"/>
      <circle cx="20" cy="22" r="5" fill="#E56332"/>
      <text x="34" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">本机账本服务 · 127.0.0.1</text>
    </g>

    <!-- Arrows down -->
    <path d="M122 182 L122 194 M338 182 L338 194" stroke="#E56332" stroke-width="2" stroke-linecap="round"/>

    <!-- Outputs -->
    <g transform="translate(24 196)">
      <rect x="0" y="0" width="196" height="36" rx="8" fill="#FFF7F5" stroke="#FCD5C7"/>
      <text x="16" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#C2410C">本地 SQLite 账本</text>

      <rect x="216" y="0" width="196" height="36" rx="8" fill="#F4F4F5" stroke="#E4E4E7"/>
      <text x="232" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#18181B">轻记浏览器看板</text>
    </g>
  </g>
</svg>
