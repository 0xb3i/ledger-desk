<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">轻记 LedgerDesk</title>
  <desc id="desc">轻记 LedgerDesk：邮箱里的账单提醒自动记进这台 Mac 上的本地账本。右侧是几条示例账目，其中一条以橙色圆点标记待核对。</desc>

  <rect width="1200" height="320" rx="24" fill="#F6F6F7"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
    <text x="70" y="166" font-size="84" font-weight="600" letter-spacing="2" fill="#232426">轻记</text>
    <circle cx="252" cy="158" r="9" fill="#E56332"/>
    <text x="284" y="164" font-size="30" font-weight="500" fill="#71727A">LedgerDesk</text>
    <text x="74" y="222" font-size="26" fill="#71727A">邮箱里的账单提醒，</text>
    <text x="74" y="258" font-size="26" fill="#71727A">自动记进这台 Mac 的本地账本</text>
  </g>

  <g id="ledger" transform="translate(680 56)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="22">
    <rect x="0" y="0" width="448" height="208" rx="16" fill="#FFFFFF" stroke="#EAEAEE"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#9A9BA2">
      <text x="28" y="50">11·23</text>
      <text x="28" y="118">11·23</text>
      <text x="28" y="186">11·22</text>
    </g>
    <text x="108" y="50" fill="#232426">午餐</text>
    <text x="108" y="118" fill="#232426">打车</text>
    <text x="108" y="186" fill="#232426">退款</text>
    <g font-size="18" fill="#9A9BA2">
      <text x="164" y="50">餐饮</text>
      <text x="164" y="118">交通</text>
      <text x="164" y="186">购物</text>
    </g>
    <circle cx="230" cy="111" r="5" fill="#E56332"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">
      <text x="420" y="50" fill="#232426">−38.00</text>
      <text x="420" y="118" fill="#232426">−46.50</text>
      <text x="420" y="186" fill="#4D8061">+129.00</text>
    </g>
    <path d="M24 70 H424 M24 138 H424" stroke="#F1F1F4"/>
  </g>
</svg>
